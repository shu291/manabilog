<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>まなびログ — 学習管理</title>
<style>
:root{
  --bg:#f4f5fb; --surface:#ffffff; --surface-2:#f8f9ff; --text:#1e2233; --text-dim:#6b7191;
  --border:#e7e9f5; --primary:#6366f1; --primary-soft:#eef0ff; --primary-ink:#4f46e5;
  --accent:#10b981; --warn:#f59e0b; --danger:#ef4444; --shadow:0 4px 20px rgba(60,66,120,.08);
  --shadow-lg:0 12px 40px rgba(60,66,120,.14); --radius:18px; --radius-sm:12px;
  --s1:#6366f1; --s2:#ec4899; --s3:#f59e0b; --s4:#10b981; --s5:#06b6d4; --s6:#8b5cf6; --s7:#ef4444;
}
[data-theme="dark"]{
  --bg:#0f1120; --surface:#191c30; --surface-2:#20233c; --text:#eef0fb; --text-dim:#9aa0c5;
  --border:#2a2e4a; --primary:#818cf8; --primary-soft:#232748; --primary-ink:#a5b4fc;
  --shadow:0 4px 20px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6;
  -webkit-font-smoothing:antialiased; transition:background .3s,color .3s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:800;font-size:20px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--s1),var(--s2));
  display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 4px 12px rgba(99,102,241,.4)}
.nav-btn{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--text-dim);
  font-weight:600;font-size:15px;transition:.15s;width:100%;text-align:left;
}
.nav-btn .ic{font-size:19px;width:22px;text-align:center}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary-ink)}
.sidebar .spacer{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:18px 26px;
  position:sticky;top:0;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(12px);z-index:20;border-bottom:1px solid transparent;
}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:13px;color:var(--text-dim);font-weight:500}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;font-size:18px;transition:.15s;box-shadow:var(--shadow)}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.content{padding:8px 26px 40px;max-width:1080px;width:100%;margin:0 auto}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow)}
.section-title{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title .badge{font-size:12px;font-weight:700;color:var(--text-dim);background:var(--surface-2);
  padding:2px 9px;border-radius:20px}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}

/* stat cards */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .k{font-size:13px;color:var(--text-dim);font-weight:600;display:flex;align-items:center;gap:7px}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.stat .v small{font-size:15px;font-weight:700;color:var(--text-dim)}
.stat .sub{font-size:12px;color:var(--text-dim);margin-top:4px}
.stat .orb{position:absolute;right:-14px;top:-14px;width:70px;height:70px;border-radius:50%;opacity:.12}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:12px;font-weight:700;
  font-size:14px;background:var(--surface-2);color:var(--text);transition:.15s;border:1px solid var(--border)}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--s1),var(--primary-ink));color:#fff;border:none;
  box-shadow:0 6px 16px rgba(99,102,241,.35)}
.btn.ghost{background:transparent;border:1px solid var(--border)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{color:var(--danger)}

/* ===== Tasks ===== */
.task-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;background:var(--surface);
  border:1px solid var(--border);color:var(--text-dim);transition:.15s}
.chip.active{background:var(--primary-soft);color:var(--primary-ink);border-color:transparent}
.task{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);margin-bottom:10px;
  transition:.15s;position:relative}
.task:hover{box-shadow:var(--shadow-lg)}
.task.done{opacity:.55}
.task.done .task-title{text-decoration:line-through}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;margin-top:2px;
  display:grid;place-items:center;color:#fff;font-size:14px;transition:.15s}
.check.on{background:var(--accent);border-color:var(--accent)}
.task-body{flex:1;min-width:0}
.task-title{font-weight:700;font-size:15px;word-break:break-word}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--text-dim);align-items:center}
.tag{padding:2px 9px;border-radius:20px;font-weight:700;font-size:11px}
.due{font-weight:700}
.due.today{color:var(--warn)}.due.over{color:var(--danger)}
.prio-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.task-x{opacity:0;transition:.15s;color:var(--text-dim);font-size:18px;padding:4px}
.task:hover .task-x{opacity:1}
.empty{text-align:center;padding:44px 20px;color:var(--text-dim)}
.empty .em{font-size:44px;margin-bottom:10px}

/* ===== Timer ===== */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:14px}
.ring{position:relative;width:270px;height:270px}
.ring svg{transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time .big{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .time .mode{font-size:13px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.timer-modes{display:flex;gap:8px}
.timer-ctrl{display:flex;gap:12px;align-items:center}
.big-btn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(135deg,var(--s1),var(--primary-ink));color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.4);transition:.15s}
.big-btn:hover{transform:scale(1.06)}
.big-btn.sec{width:52px;height:52px;font-size:19px;background:var(--surface-2);color:var(--text);box-shadow:var(--shadow)}

/* ===== FocusTube (作業用動画) ===== */
.yt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-top:16px;overflow:hidden}
.yt-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
.yt-head .t{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.yt-head .hint{font-size:12px;color:var(--text-dim);margin-left:auto;text-align:right}
.yt-tabs{display:flex;gap:7px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
.yt-tabs::-webkit-scrollbar{display:none}
.yt-tab{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap;transition:.15s;cursor:pointer}
.yt-tab.active{background:var(--primary-soft);color:var(--primary-ink);border-color:transparent}
.yt-tab.add{color:var(--primary-ink);border-style:dashed}
.yt-player{background:#000;aspect-ratio:16/9;display:none}
.yt-player iframe{width:100%;height:100%;display:block;border:0}
.yt-search{display:none;gap:8px;padding:0 14px 12px}
.yt-search input{flex:1;background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);
  border-radius:11px;padding:11px 13px;outline:none;font-size:15px}
.yt-search input:focus{border-color:var(--primary)}
.yt-search button{background:var(--primary);color:#fff;border:none;border-radius:11px;padding:0 16px;font-weight:700;cursor:pointer}
.yt-list{padding:4px 14px 16px}
.yt-item{display:flex;gap:11px;align-items:center;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:9px;margin-bottom:9px;cursor:pointer;position:relative;transition:.15s}
.yt-item:hover{border-color:var(--primary)}
.yt-item.playing{border-color:var(--primary);background:var(--primary-soft)}
.yt-thumb{width:110px;min-width:110px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:#000}
.yt-meta{flex:1;min-width:0}
.yt-title{font-size:13.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.yt-idx{font-size:11px;color:var(--text-dim);margin-top:5px;font-weight:700}
.yt-item.playing .yt-idx{color:var(--primary-ink)}
.yt-star{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-size:15px;display:grid;place-items:center}
.yt-star.on{color:var(--warn);border-color:var(--warn)}
.yt-status{padding:26px 16px;text-align:center;color:var(--text-dim);font-size:13.5px;line-height:1.9;display:none}
.yt-status b{color:var(--text)}
.yt-bigbtn{display:inline-block;margin-top:10px;background:var(--primary);color:#fff;border:none;
  border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer}

/* ===== Forms / Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(15,17,32,.55);backdrop-filter:blur(4px);z-index:100;
  display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:24px 22px 30px;
  box-shadow:var(--shadow-lg);animation:slideUp .3s ease;max-height:92vh;overflow-y:auto}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:24px}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:19px;font-weight:800;margin-bottom:18px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text-dim)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);transition:.15s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.seg{display:flex;gap:7px}
.seg button{flex:1;padding:10px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-2);
  font-weight:700;font-size:13px;color:var(--text-dim);transition:.15s}
.seg button.on{color:#fff;border-color:transparent}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions .btn{flex:1;justify-content:center;padding:13px}

/* ===== Progress ===== */
.prog{height:9px;border-radius:20px;background:var(--surface-2);overflow:hidden}
.prog span{display:block;height:100%;border-radius:20px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.goal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.goal-row .lbl{font-weight:700;font-size:14px}
.goal-row .val{font-size:13px;color:var(--text-dim);font-weight:600}

/* ===== Charts ===== */
.bars{display:flex;align-items:flex-end;gap:9px;height:150px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--s1),var(--primary-ink));
  transition:height .6s cubic-bezier(.4,0,.2,1);min-height:4px;position:relative}
.bar-col .day{font-size:11px;color:var(--text-dim);font-weight:600}
.bar-col .amt{font-size:10px;color:var(--text-dim);font-weight:700;height:12px}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px}
.legend-item{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
.legend-item .sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.legend-item .pct{margin-left:auto;color:var(--text-dim);font-weight:700}

/* streak calendar */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:5px}
.heat .cell{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;
  z-index:200;transition:.3s;box-shadow:var(--shadow-lg);pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:900px){.toast{bottom:30px}}

.fab{display:none}

/* ===== Mobile ===== */
.bottom-nav{display:none}
@media(max-width:860px){
  .sidebar{display:none}
  .content{padding:4px 15px 100px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:19px}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
    border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:50;justify-content:space-around;
  }
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);
    font-size:10px;font-weight:700;padding:4px 10px;border-radius:12px;transition:.15s}
  .bottom-nav button .ic{font-size:21px}
  .bottom-nav button.active{color:var(--primary-ink)}
  .fab{display:grid;position:fixed;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;
    place-items:center;font-size:26px;background:linear-gradient(135deg,var(--s1),var(--primary-ink));
    color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.5);z-index:55}
}
@media(min-width:861px){.ring{width:290px;height:290px}}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand"><div class="logo">📚</div><span>まなびログ</span></div>
    <button class="nav-btn active" data-nav="dash"><span class="ic">🏠</span>ホーム</button>
    <button class="nav-btn" data-nav="tasks"><span class="ic">✅</span>課題</button>
    <button class="nav-btn" data-nav="timer"><span class="ic">📺</span>勉強</button>
    <button class="nav-btn" data-nav="goals"><span class="ic">🎯</span>目標</button>
    <button class="nav-btn" data-nav="stats"><span class="ic">📊</span>統計</button>
    <div class="spacer"></div>
    <button class="nav-btn" data-nav="settings"><span class="ic">⚙️</span>設定</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div><h1 id="viewTitle">ホーム</h1><div class="sub" id="viewSub"></div></div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="テーマ切替">🌙</button>
      </div>
    </header>

    <div class="content">
      <!-- ===== Dashboard ===== -->
      <section class="view active" id="view-dash"></section>
      <!-- ===== Tasks ===== -->
      <section class="view" id="view-tasks"></section>
      <!-- ===== Timer ===== -->
      <section class="view" id="view-timer"></section>
      <!-- ===== Goals ===== -->
      <section class="view" id="view-goals"></section>
      <!-- ===== Stats ===== -->
      <section class="view" id="view-stats"></section>
      <!-- ===== Settings ===== -->
      <section class="view" id="view-settings"></section>
    </div>
  </div>
</div>

<button class="fab" id="fab">＋</button>

<nav class="bottom-nav">
  <button class="active" data-nav="dash"><span class="ic">🏠</span>ホーム</button>
  <button data-nav="tasks"><span class="ic">✅</span>課題</button>
  <button data-nav="timer"><span class="ic">📺</span>勉強</button>
  <button data-nav="stats"><span class="ic">📊</span>統計</button>
  <button data-nav="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   まなびログ — 学習管理アプリ (single file, no dependencies)
   ============================================================ */
"use strict";

const SUBJECTS = [
  {id:"kokugo", name:"国語", color:"var(--s1)"},
  {id:"math",   name:"数学", color:"var(--s2)"},
  {id:"eng",    name:"英語", color:"var(--s3)"},
  {id:"sci",    name:"理科", color:"var(--s4)"},
  {id:"soc",    name:"社会", color:"var(--s5)"},
  {id:"other",  name:"その他", color:"var(--s6)"},
];
const subj = id => SUBJECTS.find(s=>s.id===id) || SUBJECTS[SUBJECTS.length-1];
const PRIO = {high:{name:"高",color:"var(--danger)"},mid:{name:"中",color:"var(--warn)"},low:{name:"低",color:"var(--accent)"}};
const QUOTES = [
  "今日の努力は、未来の自分への贈り物。","小さな積み重ねが、大きな差になる。",
  "できないんじゃない、まだやってないだけ。","1問解けば、昨日より賢い。",
  "集中した25分は、だらけた2時間に勝る。","続ける人が、最後に笑う。",
  "やる気は、始めたあとに湧いてくる。","昨日の自分を、少しだけ超えよう。"
];

/* ---------- State ---------- */
const DEFAULT = {
  tasks:[], sessions:[], theme:"light",
  goals:{ weeklyMin:600, bySubject:{} },
  settings:{ pomoFocus:25, pomoBreak:5 },
  streak:{ last:null, count:0 },
  videos:{ playlists:[], favs:[], history:[] }
};
let S = load();

function load(){
  try{
    const raw = localStorage.getItem("manabilog");
    if(!raw) return structuredClone(DEFAULT);
    const d = JSON.parse(raw);
    return {...structuredClone(DEFAULT), ...d,
      goals:{...DEFAULT.goals,...(d.goals||{})},
      settings:{...DEFAULT.settings,...(d.settings||{})},
      streak:{...DEFAULT.streak,...(d.streak||{})},
      videos:{playlists:[],favs:[],history:[],...(d.videos||{})}};
  }catch(e){ return structuredClone(DEFAULT); }
}
function save(){ localStorage.setItem("manabilog", JSON.stringify(S)); }

/* ---------- Date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
function todayKey(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDate(k){ if(!k) return ""; const [y,m,d]=k.split("-"); return `${+m}/${+d}`; }
function dayDiff(k){ // days from today (negative = past)
  const t=new Date(todayKey()); const x=new Date(k); return Math.round((x-t)/86400000);
}
function minToHM(m){ const h=Math.floor(m/60), mm=Math.round(m%60); return h>0?`${h}時間${mm}分`:`${mm}分`; }
function minShort(m){ const h=Math.floor(m/60), mm=Math.round(m%60); return h>0?`${h}h${mm?mm+"m":""}`:`${mm}m`; }
const WD = ["日","月","火","水","木","金","土"];

let toastT;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1900);
}

/* ---------- Streak ---------- */
function bumpStreak(){
  const tk=todayKey();
  if(S.streak.last===tk) return;
  const y=new Date(tk); y.setDate(y.getDate()-1);
  S.streak.count = (S.streak.last===todayKey(y)) ? S.streak.count+1 : 1;
  S.streak.last = tk; save();
}
function currentStreak(){
  if(!S.streak.last) return 0;
  const diff = dayDiff(S.streak.last); // 0 today, -1 yesterday
  return (diff===0||diff===-1) ? S.streak.count : 0;
}

/* ---------- Aggregations ---------- */
function minutesOn(dateKey){
  return S.sessions.filter(s=>s.date===dateKey).reduce((a,s)=>a+s.min,0);
}
function weekKeys(){ // last 7 days incl today, oldest first
  const arr=[]; const t=new Date(todayKey());
  for(let i=6;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); arr.push(todayKey(d)); }
  return arr;
}
function weekMinutes(){ return weekKeys().reduce((a,k)=>a+minutesOn(k),0); }
function subjectMinutes(days=7){
  const keys = days? weekKeys() : null;
  const map={}; SUBJECTS.forEach(s=>map[s.id]=0);
  S.sessions.forEach(s=>{ if(!keys||keys.includes(s.date)) map[s.subject]=(map[s.subject]||0)+s.min; });
  return map;
}

function dateLabel(){ const d=new Date(); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; }
function statCard(k,ic,v,sub,color){
  return `<div class="stat"><div class="orb" style="background:${color}"></div>
    <div class="k">${ic} ${k}</div><div class="v">${v}</div>
    <div class="sub">${sub||"&nbsp;"}</div></div>`;
}
function weekBars(){
  const keys=weekKeys(); const mins=keys.map(minutesOn); const max=Math.max(60,...mins);
  return `<div class="bars">${keys.map((k,i)=>{
    const h=Math.round(mins[i]/max*100); const d=new Date(k);
    const isToday=k===todayKey();
    return `<div class="bar-col"><div class="amt">${mins[i]?minShort(mins[i]):""}</div>
      <div class="bar" style="height:${h}%;${isToday?'background:linear-gradient(180deg,var(--s3),var(--warn))':''}"></div>
      <div class="day">${WD[d.getDay()]}</div></div>`;
  }).join("")}</div>`;
}
function taskMiniRow(t){
  const s=subj(t.subject); const dd=t.due?dayDiff(t.due):null;
  let dueCls="",dueTxt="";
  if(t.due){ dueTxt = dd<0?`${-dd}日超過`:dd===0?"今日":dd===1?"明日":`${dd}日後`; dueCls=dd<0?"over":dd<=0?"today":""; }
  return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
    <span class="tag" style="background:${s.color}22;color:${s.color}">${s.name}</span>
    <span style="flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</span>
    ${t.due?`<span class="due ${dueCls}" style="font-size:12px">${dueTxt}</span>`:""}
  </div>`;
}

/* ---------- Tasks ---------- */
let taskFilter="open", taskSort="due";
function renderTasks(){
  const el=document.getElementById("view-tasks");
  let list=[...S.tasks];
  if(taskFilter==="open") list=list.filter(t=>!t.done);
  else if(taskFilter==="done") list=list.filter(t=>t.done);
  else if(SUBJECTS.some(s=>s.id===taskFilter)) list=list.filter(t=>t.subject===taskFilter);
  list.sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    if(taskSort==="due"){ if(!a.due) return 1; if(!b.due) return -1; return a.due.localeCompare(b.due); }
    if(taskSort==="prio"){ const o={high:0,mid:1,low:2}; return o[a.prio]-o[b.prio]; }
    return (b.created||0)-(a.created||0);
  });
  const openCount=S.tasks.filter(t=>!t.done).length;

  el.innerHTML=`
    <div class="task-toolbar">
      <button class="chip ${taskFilter==='open'?'active':''}" onclick="setFilter('open')">未完了 ${openCount}</button>
      <button class="chip ${taskFilter==='done'?'active':''}" onclick="setFilter('done')">完了済み</button>
      <button class="chip ${taskFilter==='all'?'active':''}" onclick="setFilter('all')">すべて</button>
      <span style="width:1px;height:20px;background:var(--border);margin:0 2px"></span>
      ${SUBJECTS.map(s=>`<button class="chip ${taskFilter===s.id?'active':''}" onclick="setFilter('${s.id}')">${s.name}</button>`).join("")}
      <div style="flex:1"></div>
      <select onchange="taskSort=this.value;renderTasks()" style="padding:7px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;color:var(--text-dim)">
        <option value="due" ${taskSort==='due'?'selected':''}>期限順</option>
        <option value="prio" ${taskSort==='prio'?'selected':''}>優先度順</option>
        <option value="created" ${taskSort==='created'?'selected':''}>追加順</option>
      </select>
      <button class="btn primary sm" onclick="openTaskModal()">＋ 追加</button>
    </div>
    <div id="taskList">
      ${list.length? list.map(taskRow).join("") :
        `<div class="empty"><div class="em">${taskFilter==='done'?'📭':'🌱'}</div>
         ${taskFilter==='done'?'完了した課題はまだありません':'課題がありません。「＋追加」から登録しよう'}</div>`}
    </div>`;
}
function setFilter(f){ taskFilter=f; renderTasks(); }
function taskRow(t){
  const s=subj(t.subject); const p=PRIO[t.prio]||PRIO.mid;
  const dd=t.due?dayDiff(t.due):null; let dueCls="",dueTxt="";
  if(t.due){ dueTxt=`${fmtDate(t.due)}(${WD[new Date(t.due).getDay()]})`;
    if(!t.done){ if(dd<0){dueCls="over";dueTxt=`${-dd}日超過`;} else if(dd===0){dueCls="today";dueTxt="今日まで";} else if(dd===1){dueCls="today";dueTxt="明日まで";} } }
  return `<div class="task ${t.done?'done':''}">
    <button class="check ${t.done?'on':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button>
    <div class="task-body" onclick="openTaskModal('${t.id}')" style="cursor:pointer">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        <span class="tag" style="background:${s.color}22;color:${s.color}">${s.name}</span>
        <span style="display:flex;align-items:center;gap:5px"><span class="prio-dot" style="background:${p.color}"></span>優先度${p.name}</span>
        ${t.due?`<span class="due ${dueCls}">📅 ${dueTxt}</span>`:""}
        ${t.note?`<span>📝 ${esc(t.note).slice(0,24)}${t.note.length>24?'…':''}</span>`:""}
      </div>
    </div>
    <button class="task-x" onclick="delTask('${t.id}')">🗑️</button>
  </div>`;
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  t.done=!t.done; if(t.done){ t.doneAt=todayKey(); toast("✅ 完了！おつかれさま"); } save(); renderTasks();
  if(current==="dash") renderDash();
}
function delTask(id){
  const t=S.tasks.find(x=>x.id===id);
  confirmModal("課題を削除しますか？", esc(t?.title||""), ()=>{
    S.tasks=S.tasks.filter(x=>x.id!==id); save(); renderTasks(); toast("削除しました");
  });
}

  const editing=!!id;
  openModal(`
    <h3>${editing?"課題を編集":"課題を追加"}</h3>
    <div class="field"><label>課題名</label>
      <input id="f-title" placeholder="例：数学 P.42〜45 の問題" value="${esc(t.title)}" maxlength="80"></div>
    <div class="field"><label>教科</label>
      <div class="seg" id="f-subject">${SUBJECTS.map(s=>`<button data-v="${s.id}" class="${t.subject===s.id?'on':''}" style="${t.subject===s.id?`background:${s.color};`:''}">${s.name}</button>`).join("")}</div></div>
    <div class="field"><label>優先度</label>
      <div class="seg" id="f-prio">${Object.entries(PRIO).map(([k,p])=>`<button data-v="${k}" class="${t.prio===k?'on':''}" style="${t.prio===k?`background:${p.color};`:''}">${p.name}</button>`).join("")}</div></div>
    <div class="field"><label>締め切り（任意）</label>

    <div class="field"><label>メモ（任意）</label>
      <textarea id="f-note" rows="2" placeholder="ページ数・範囲・注意点など">${esc(t.note||"")}</textarea></div>
    <div class="modal-actions">
      ${editing?`<button class="btn danger" onclick="delTask('${id}');closeModal()">削除</button>`:""}
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" onclick="saveTask('${id||''}')">保存</button>
    </div>`);
  segPick("f-subject",SUBJECTS.reduce((o,s)=>(o[s.id]=s.color,o),{}));
  segPick("f-prio",Object.fromEntries(Object.entries(PRIO).map(([k,p])=>[k,p.color])));
  setTimeout(()=>document.getElementById("f-title").focus(),100);
}
function segPick(id,colors){
  const box=document.getElementById(id);
  box.querySelectorAll("button").forEach(b=> b.onclick=()=>{
    box.querySelectorAll("button").forEach(x=>{x.classList.remove("on");x.style.background="";});
    b.classList.add("on"); b.style.background=colors[b.dataset.v]; box.dataset.val=b.dataset.v;
  });
  const on=box.querySelector("button.on"); box.dataset.val= on?on.dataset.v:"";
}
function saveTask(id){
  const title=document.getElementById("f-title").value.trim();
  if(!title){ toast("課題名を入力してください"); return; }
  const data={ title,
    subject:document.getElementById("f-subject").dataset.val||"other",
    prio:document.getElementById("f-prio").dataset.val||"mid",
    due:document.getElementById("f-due").value||"",
    note:document.getElementById("f-note").value.trim() };
  if(id){ Object.assign(S.tasks.find(x=>x.id===id), data); toast("更新しました"); }
  else { S.tasks.push({id:uid(),done:false,created:Date.now(),...data}); toast("課題を追加しました"); }
  save(); closeModal(); renderTasks(); if(current==="dash") renderDash();
}

/* --- 学習クロック：プレーヤーが再生中の間だけ加算 --- */
function startWatchClock(){
  if(watchInt) return;
  watchInt=setInterval(()=>addWatch(5),5000);
  const ws=document.getElementById("watchState"); if(ws) ws.textContent="🔴 記録中";
}
function stopWatchClock(){
  if(watchInt){ clearInterval(watchInt); watchInt=null; }
  const ws=document.getElementById("watchState"); if(ws) ws.textContent="● 停止中";
}
function addWatch(sec){
  const k=todayKey();
  let s=S.sessions.find(x=>x.date===k && x.subject===studySubject && x.mode==="video");
  if(!s){ s={id:uid(),date:k,subject:studySubject,min:0,sec:0,mode:"video",at:Date.now()}; S.sessions.push(s); }
  s.sec=(s.sec||Math.round((s.min||0)*60))+sec;   // 秒で正確に積み上げ、分は端数込みで保持
  s.min=s.sec/60;
  bumpStreak(); save();
  if(current==="timer") renderStudyToday();
  else if(current==="dash"){ const now=Math.floor(minutesOn(k)); if(now!==lastDashMin){ lastDashMin=now; renderDash(); } }
}
function todaySessionList(){
  const list=S.sessions.filter(s=>s.date===todayKey()).sort((a,b)=>(b.at||0)-(a.at||0));
  if(!list.length) return `<div class="empty" style="padding:26px"><div class="em">🌿</div>まだ記録がありません</div>`;
  return list.map(s=>{const sj=subj(s.subject);
    const label=s.mode==='video'?'📺 動画':s.mode==='manual'?'✏️ 手動':s.mode==='pomo'?'🍅 ポモドーロ':'⏱️ 計測';
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
      <span class="tag" style="background:${sj.color}22;color:${sj.color}">${sj.name}</span>
      <span style="flex:1;font-size:13px;color:var(--text-dim)">${label}</span>
      <b style="font-size:14px">${minToHM(s.min)}</b>
      <button class="task-x" style="opacity:.6" onclick="delSession('${s.id}')">✕</button>
    </div>`;}).join("");
}
function delSession(id){ S.sessions=S.sessions.filter(x=>x.id!==id); save(); if(current==="timer") renderStudyToday(); toast("記録を削除しました"); }

/* ============================================================
   FocusTube — 作業用YouTube動画（タイマー画面に統合）
   教科=再生リスト / お気に入り / 検索 / 履歴
   ============================================================ */
const YK = { key:"manabilog_ytkey", cache:"manabilog_ytcache_" };
let ytKey = localStorage.getItem(YK.key) || "";
let yt = { player:null, apiReady:false, pending:null, loading:false, list:[], idx:-1, ctx:"", playingCtx:"",
  tab:(S.videos.playlists[0] ? S.videos.playlists[0].id : "fav") };

function loadYTApi(){
  if(window.YT && window.YT.Player){ yt.apiReady=true; return; }
  if(yt.loading) return; yt.loading=true;
  window.onYouTubeIframeAPIReady=()=>{ yt.apiReady=true; if(yt.pending){const f=yt.pending;yt.pending=null;f();} };
  const tag=document.createElement("script"); tag.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
function ensureYTPlayer(cb){
  if(yt.player){ cb&&cb(); return; }
  loadYTApi();
  if(!yt.apiReady){ yt.pending=()=>ensureYTPlayer(cb); return; }
  yt.player=new YT.Player("ytPlayerHost",{
    playerVars:{ rel:0, playsinline:1, iv_load_policy:3 },
    events:{ onReady:()=>cb&&cb(), onStateChange:ytOnState }
  });
}
function ytOnState(e){
  if(e.data===YT.PlayerState.PLAYING) startWatchClock(); else stopWatchClock();
  if(e.data===YT.PlayerState.PLAYING){
    try{ const m=yt.player.getVideoUrl().match(/[?&]v=([A-Za-z0-9_-]+)/);
      if(m){ const i=yt.list.findIndex(x=>x.id===m[1]); if(i!==-1&&i!==yt.idx){ yt.idx=i; yt.playingCtx=yt.ctx; updateYTPlaying(); } } }catch(_){}
  }
  if(e.data===YT.PlayerState.ENDED && yt.idx>-1 && yt.idx<yt.list.length-1) ytPlayAt(yt.idx+1,false);
}

function ytShowPlaylist(id){
  const s=S.videos.playlists.find(x=>x.id===id);
  if(!s){ ytSelectTab("fav"); return; }
  yt.ctx=id;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(YK.cache+s.pl)||"null"); }catch(_){}
  if(cached && cached.ids && cached.ids.length){
    yt.list=cached.ids.map(vid=>({id:vid,title:(cached.titles||{})[vid]||""})); renderYTList(); ytHideStatus();
  }else{ document.getElementById("ytList").innerHTML=""; ytStatus("「"+esc(s.name)+"」を読み込み中…"); }
  ytLoadPlaylist(s);
}
function ytLoadPlaylist(s){
  ensureYTPlayer(()=>{
    try{ yt.player.cuePlaylist({listType:"playlist",list:s.pl}); }catch(_){}
    let tries=0;
    const poll=()=>{
      if(yt.ctx!==s.id) return;
      let ids=null; try{ ids=yt.player.getPlaylist(); }catch(_){}
      if(ids&&ids.length){
        yt.list=ids.map(vid=>({id:vid,title:""})); renderYTList(); ytHideStatus();
        ytFetchTitles(s.pl,ids); return;
      }
      if(tries++>60){ ytStatus("読み込めませんでした😢<br>再生リストが「非公開」になっていないか確認してね。","URLを入れ直す",()=>ytEditPlaylist(s.id)); return; }
      setTimeout(poll,250);
    };
    poll();
  });
}
async function ytFetchTitles(pl,ids){
  const titles={};
  await Promise.all(ids.map(async id=>{ try{ const r=await fetch("https://noembed.com/embed?url=https://www.youtube.com/watch?v="+id); const j=await r.json(); if(j.title) titles[id]=j.title; }catch(_){} }));
  try{ localStorage.setItem(YK.cache+pl,JSON.stringify({ids,titles})); }catch(_){}
  const s=S.videos.playlists.find(x=>x.pl===pl);
  if(s && yt.ctx===s.id){ yt.list=ids.map(vid=>({id:vid,title:titles[vid]||""})); renderYTList(); }
}

async function ytRunSearch(q){
  q=(q||"").trim(); if(!q) return; yt.ctx="search";
  document.getElementById("ytList").innerHTML=""; ytStatus("「"+esc(q)+"」を検索中…");
  const url="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=25&safeSearch=strict&videoEmbeddable=true&relevanceLanguage=ja&regionCode=JP&q="+encodeURIComponent(q)+"&key="+encodeURIComponent(ytKey);
  try{
    const r=await fetch(url); const j=await r.json();
    if(j.error){ const reason=(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||"";
      if(reason==="quotaExceeded") ytStatus("今日の無料検索の上限に達しました。<br>明日また使えます🙏");
      else ytStatus("検索できませんでした。APIキーを確認してね。","キーを確認",ytKeyModal);
      return; }
    const items=(j.items||[]).map(it=>({id:it.id.videoId,title:it.snippet.title}));
    if(!items.length){ ytStatus("結果が見つかりませんでした。"); return; }
    yt.list=items; renderYTList(); ytHideStatus();
  }catch(e){ ytStatus("通信に失敗しました。電波を確認してね。"); }
}
function ytShowHistory(){
  ytHideStatus(); yt.ctx="history";
  if(!S.videos.history.length){ document.getElementById("ytList").innerHTML=""; ytStatus("まだ再生した動画がありません。"); return; }
  yt.list=S.videos.history.map(h=>({id:h.id,title:h.title})); renderYTList();
  ytAppendBtn("🗑 履歴を消す",()=>{ S.videos.history=[]; save(); renderYTTabs(); ytSelectTab("fav"); },true);

function renderYTList(){
  const list=document.getElementById("ytList"); if(!list) return; list.innerHTML="";
  yt.list.forEach((v,i)=>{
    const el=document.createElement("div"); const on=(i===yt.idx&&yt.ctx===yt.playingCtx);
    el.className="yt-item"+(on?" playing":""); el.dataset.idx=i;
    const t=v.title||"動画 "+(i+1); const faved=ytIsFav(v.id);
    el.innerHTML=`<img class="yt-thumb" loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg">
      <div class="yt-meta"><div class="yt-title">${esc(t)}</div><div class="yt-idx">${on?"▶ 再生中":"#"+(i+1)}</div></div>
      <div class="yt-star${faved?" on":""}" data-star="${i}">${faved?"★":"☆"}</div>`;
    el.onclick=e=>{ if(e.target.dataset.star!==undefined){ ytToggleFav(v); e.stopPropagation(); return; } ytPlayAt(i); };
    list.appendChild(el);
  });
}
function ytAppendBtn(label,fn,danger){
  const b=document.createElement("button"); b.className="yt-bigbtn"; b.style.width="100%";
  if(danger){ b.style.background="transparent"; b.style.color="var(--danger)"; b.style.border="1px solid var(--border)"; }
  b.textContent=label; b.onclick=fn; document.getElementById("ytList").appendChild(b);
}
function ytPlayAt(i,scroll){
  if(i<0||i>=yt.list.length) return;
  yt.idx=i; yt.playingCtx=yt.ctx; ytPushHistory(yt.list[i]);
  document.getElementById("ytPlayerWrap").style.display="block";   // 押した瞬間に再生エリアを表示
  ensureYTPlayer(()=>{ yt.player.loadVideoById(yt.list[i].id); });
  updateYTPlaying();
  if(scroll!==false){ const w=document.getElementById("ytPlayerWrap"); if(w) w.scrollIntoView({behavior:"smooth",block:"center"}); }
}
function updateYTPlaying(){
  document.querySelectorAll("#ytList .yt-item").forEach(el=>{
    const i=+el.dataset.idx; const on=(i===yt.idx&&yt.ctx===yt.playingCtx);
    el.classList.toggle("playing",on);
    const idx=el.querySelector(".yt-idx"); if(idx) idx.textContent=on?"▶ 再生中":"#"+(i+1);
  });
}
function ytIsFav(id){ return S.videos.favs.some(f=>f.id===id); }
function ytToggleFav(v){
  if(ytIsFav(v.id)) S.videos.favs=S.videos.favs.filter(f=>f.id!==v.id);
  else { S.videos.favs.unshift({id:v.id,title:v.title||""}); if(!v.title) ytFetchFavTitle(v.id); }
  save(); if(yt.ctx==="fav") ytShowFav(); else renderYTList();
}
async function ytFetchFavTitle(id){
  try{ const r=await fetch("https://noembed.com/embed?url=https://www.youtube.com/watch?v="+id); const j=await r.json();
    if(j.title){ const f=S.videos.favs.find(x=>x.id===id); if(f){ f.title=j.title; save(); if(yt.ctx==="fav") ytShowFav(); } } }catch(_){}
}
function ytPushHistory(v){
  if(!v||!v.id) return;
  S.videos.history=S.videos.history.filter(h=>h.id!==v.id);
  S.videos.history.unshift({id:v.id,title:v.title||"",ts:Date.now()});
  if(S.videos.history.length>40) S.videos.history.length=40;
  save(); if(yt.tab!=="history") renderYTTabs();
}

function extractPl(input){ input=(input||"").trim(); const m=input.match(/[?&]list=([A-Za-z0-9_-]+)/); if(m) return m[1]; if(/^(PL|UU|LL|OL|RD|FL)[A-Za-z0-9_-]{8,}$/.test(input)) return input; return null; }
function extractVid(input){ input=(input||"").trim(); let m=input.match(/[?&]v=([A-Za-z0-9_-]{11})/); if(m) return m[1]; m=input.match(/youtu\.be\/([A-Za-z0-9_-]{11})/); if(m) return m[1]; m=input.match(/\/(shorts|embed)\/([A-Za-z0-9_-]{11})/); if(m) return m[2]; if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input; return null; }

        <div class="section-title">学習カレンダー <span class="badge">直近8週</span></div>
        ${heatmap()}
        <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;font-size:11px;color:var(--text-dim)">
          少 <span class="heat" style="display:flex;gap:3px"><span style="width:12px;height:12px;border-radius:3px;background:var(--surface-2)"></span><span style="width:12px;height:12px;border-radius:3px;background:var(--s1);opacity:.35"></span><span style="width:12px;height:12px;border-radius:3px;background:var(--s1);opacity:.7"></span><span style="width:12px;height:12px;border-radius:3px;background:var(--s1)"></span></span> 多
        </div>
      </div>
    </div>`;
}
function bars14(){
  const t=new Date(todayKey()); const keys=[];
  for(let i=13;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);keys.push(todayKey(d));}
  const mins=keys.map(minutesOn); const max=Math.max(60,...mins);
  return `<div class="bars" style="height:170px">${keys.map((k,i)=>{
    const h=Math.round(mins[i]/max*100); const d=new Date(k); const today=k===todayKey();
    return `<div class="bar-col"><div class="amt">${mins[i]?minShort(mins[i]):''}</div>
      <div class="bar" style="height:${h}%;${today?'background:linear-gradient(180deg,var(--s3),var(--warn))':''}"></div>
      <div class="day">${d.getDate()}</div></div>`;
  }).join("")}</div>`;
}
function buildDonut(map,total){
  if(!total) return "";
  let off=0; const R=15.915; return SUBJECTS.filter(s=>map[s.id]>0).map(s=>{
    const pct=map[s.id]/total*100; const seg=`<circle cx="21" cy="21" r="${R}" fill="none" stroke="${s.color}" stroke-width="6"
      stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${25-off}" />`; off+=pct; return seg;
  }).join("");
}
function heatmap(){
  const t=new Date(todayKey()); const cells=[]; const N=56;
  // start from N-1 days ago, but align columns by week; simple 8x7 grid
  for(let i=N-1;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); const m=minutesOn(todayKey(d));
    let op=0; if(m>0)op=.35; if(m>=30)op=.55; if(m>=60)op=.8; if(m>=120)op=1;
    cells.push(`<span class="cell" style="${m>0?`background:var(--s1);opacity:${op}`:''}" title="${fmtDate(todayKey(d))}: ${minToHM(m)||'0分'}"></span>`);
  }
  return `<div class="heat" style="grid-template-columns:repeat(8,1fr);gap:5px">${cells.join("")}</div>`;
}

/* ---------- Settings ---------- */
function renderSettings(){
  const el=document.getElementById("view-settings");
  el.innerHTML=`
    <div class="card" style="margin-bottom:16px">
      <div class="section-title">表示</div>
      <div class="goal-row"><span class="lbl">ダークモード</span>
        <button class="btn sm ${S.theme==='dark'?'primary':''}" onclick="S.theme=S.theme==='dark'?'light':'dark';save();applyTheme();renderSettings()">${S.theme==='dark'?'オン':'オフ'}</button></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-title">データ管理</div>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">データはこの端末のブラウザに保存されます。機種変更前にバックアップ（書き出し）しておきましょう。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" onclick="exportData()">📤 データを書き出す</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">📥 読み込む</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
      </div>
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
        <button class="btn danger" onclick="resetAll()">🗑️ すべてのデータを削除</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">まなびログについて</div>
      <p style="font-size:13px;color:var(--text-dim)">学生のための学習管理アプリ ver 1.0<br>
      課題・タイマー・目標・統計をひとつに。オフラインでも使えて、登録不要・完全無料。</p>
      <div style="display:flex;gap:16px;margin-top:12px;font-size:13px">
        <span>📝 課題 <b>${S.tasks.length}</b></span>
        <span>⏱️ 記録 <b>${S.sessions.length}</b></span>
        <span>🔥 連続 <b>${currentStreak()}日</b></span>
      </div>
    </div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`manabilog-${todayKey()}.json`; a.click(); toast("データを書き出しました");
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!d.tasks&&!d.sessions) throw 0;
    confirmModal("データを読み込みますか？","現在のデータは上書きされます。",()=>{
      S={...structuredClone(DEFAULT),...d};
      S.videos={playlists:[],favs:[],history:[],...(d.videos||{})};
      save(); applyTheme(); nav("dash"); toast("読み込みました");
    });
  }catch(err){ toast("ファイルを読み込めませんでした"); } };
  r.readAsText(f); e.target.value="";
}
function resetAll(){
  confirmModal("本当にすべて削除しますか？","課題・記録・目標がすべて消えます。この操作は取り消せません。",()=>{
    S=structuredClone(DEFAULT); save(); applyTheme(); nav("dash"); toast("初期化しました");
  },true);
}

/* ---------- Modal core ---------- */
function openModal(html){ document.getElementById("modalBox").innerHTML=html; document.getElementById("modalBg").classList.add("open"); }
function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }
document.getElementById("modalBg").onclick=e=>{ if(e.target.id==="modalBg") closeModal(); };
function confirmModal(title,msg,onOk,danger){
  openModal(`<h3>${title}</h3><p style="color:var(--text-dim);font-size:14px;margin-bottom:6px">${msg}</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">キャンセル</button>
    <button class="btn ${danger?'':'primary'}" style="${danger?'background:var(--danger);color:#fff;border:none':''}" id="cfmOk">OK</button></div>`);
  document.getElementById("cfmOk").onclick=()=>{ closeModal(); onOk(); };
}

/* ---------- Utils ---------- */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- Boot ---------- */
applyTheme();
if(S.tasks.length===0 && S.sessions.length===0 && !localStorage.getItem("manabilog_seeded")){
  seedSample();
}
nav("dash");

function seedSample(){
  localStorage.setItem("manabilog_seeded","1");
  const t=new Date(todayKey());
  const k=(off)=>{const d=new Date(t);d.setDate(t.getDate()+off);return todayKey(d);};
  S.tasks=[
    {id:uid(),done:false,created:Date.now(),title:"数学 P.42〜45 の問題",subject:"math",prio:"high",due:k(1),note:"二次関数の復習"},
    {id:uid(),done:false,created:Date.now()-1e6,title:"英単語 Unit5 を暗記",subject:"eng",prio:"mid",due:k(0),note:""},
    {id:uid(),done:false,created:Date.now()-2e6,title:"歴史レポート 提出",subject:"soc",prio:"high",due:k(3),note:"鎌倉時代について"},
    {id:uid(),done:true,created:Date.now()-3e6,title:"理科 ワーク P.20",subject:"sci",prio:"low",due:k(-1),note:""},
  ];
  S.sessions=[];
  const sample=[[-6,["math",40],["eng",25]],[-5,["sci",50]],[-4,["math",30],["soc",20]],[-3,["eng",45]],[-2,["math",60],["kokugo",30]],[-1,["sci",35],["eng",25]],[0,["math",25]]];
  sample.forEach(([off,...ss])=>ss.forEach(([sub,min])=>S.sessions.push({id:uid(),date:k(off),subject:sub,min,sec:min*60,mode:"video",at:Date.now()})));
  S.streak={last:todayKey(),count:3};
  save();
}
</script>
